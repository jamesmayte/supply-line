<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14161a" />
    <title>Supply Line — harness</title>
    <style>
      :root { --bg: #14161a; --panel: #1d2026; --text: #e8e6e1; --dim: #9a978f; --accent: #e0b04a; --bad: #e0574a; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior: none; }
      .bar { width: 100%; max-width: 480px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); }
      #top { justify-content: space-between; flex-wrap: wrap; row-gap: 2px; }
      #top b { font-variant-numeric: tabular-nums; }
      #next { width: 100%; color: var(--dim); font-size: 12px; }
      #stage { position: relative; width: 100%; max-width: 480px; display: flex; justify-content: center; }
      canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700; background: rgba(20, 22, 26, 0.6); pointer-events: none; }
      #bottom { position: sticky; bottom: 0; flex-wrap: wrap; justify-content: center; }
      button { flex: 1 1 auto; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px;
        background: #2c3038; color: var(--text); font: 600 14px system-ui, sans-serif; }
      button:disabled { opacity: 0.35; }
      button.on { background: var(--accent); color: #1b1b1b; }
      #start { background: #3d6b46; }
      #sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px;
        background: var(--panel); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); display: none; z-index: 10; }
      #sheet.open { display: block; }
      #sheet h3 { margin: 2px 4px 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
      #sheet h3 small { color: var(--dim); font-weight: 400; }
      #sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 45dvh; overflow-y: auto; }
      #sheet .opt { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; min-height: 52px; }
      #sheet .opt span { font-weight: 400; font-size: 12px; color: var(--dim); }
      #sheet .opt.danger { background: #5a2a26; }
      #sheet .close { flex: 0 0 auto; min-height: 36px; background: transparent; color: var(--dim); }
      #toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top));
        max-width: 90%; padding: 8px 14px; border-radius: 10px; background: #5a2a26; color: var(--text);
        font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
      #toast.show { opacity: 1; }
      .row { display: flex; gap: 8px; width: 100%; }
    </style>
  </head>
  <body>
    <div class="bar" id="top">
      <span>Wave <b id="wave">1/5</b></span>
      <span>Core <b id="core">100</b></span>
      <span>Ingots <b id="ingots">20</b></span>
      <span>Kills <b id="kills">0</b></span>
      <span id="next"></span>
    </div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="banner"></div>
    </div>
    <div class="bar" id="bottom">
      <div class="row">
        <button id="demoEmpty">Empty</button>
        <button id="demoA">Demo: 1 chain</button>
        <button id="demoB">Demo: 2 chains</button>
      </div>
      <div class="row">
        <button id="start">Start wave</button>
        <button id="pause">Pause</button>
        <button id="speed">1×</button>
      </div>
    </div>
    <div id="sheet"><h3><span id="sheetTitle"></span><button class="close" id="sheetClose">Close</button></h3><div class="opts" id="sheetOpts"></div></div>
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
